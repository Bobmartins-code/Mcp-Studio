<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCP Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0F;--sur:#111118;--sur2:#18181F;--bo:rgba(255,255,255,.07);--boh:rgba(255,255,255,.14);--ac:#FF4D00;--ac2:#FF8A50;--gold:#F5C842;--ok:#2DDE98;--pu:#9B8EFF;--tx:#F0EEE8;--mu:#6B6B7A;--mu2:#9B9BAA}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--boh);border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:240px;min-width:240px;background:var(--sur);border-right:1px solid var(--bo);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto;transition:transform .3s;z-index:50}
.sb-logo{padding:0 20px 24px;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:10px}
.sb-mark{width:32px;height:32px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#fff}
.sb-name{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}.sb-name span{color:var(--ac)}
.sb-nav{padding:16px 12px 0}
.sb-lbl{font-size:10px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);padding:0 8px;margin-bottom:6px}
.sb-btn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--mu2);font-size:13px;cursor:pointer;transition:all .15s;text-align:left;font-family:'DM Sans',sans-serif}
.sb-btn:hover{background:var(--sur2);color:var(--tx)}.sb-btn.on{background:rgba(255,77,0,.12);color:var(--ac2)}
.sb-btn .bx{margin-left:auto;background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sb-new{margin:16px 12px 0;padding:10px;border-radius:8px;border:1px dashed var(--boh);background:transparent;color:var(--mu2);font-size:12.5px;cursor:pointer;transition:all .2s;width:calc(100% - 24px);font-family:'DM Sans',sans-serif}
.sb-new:hover{border-color:var(--ac);color:var(--ac)}
.sb-foot{margin-top:auto;padding:14px;border-top:1px solid var(--bo)}
.sb-user{display:flex;align-items:center;gap:9px;padding:9px;border-radius:8px;background:var(--sur2)}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--gold));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.sb-logout{margin-top:8px;width:100%;padding:7px;border-radius:6px;border:1px solid var(--bo);background:transparent;color:var(--mu);font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.sb-logout:hover{border-color:rgba(255,77,0,.4);color:var(--ac2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;border-bottom:1px solid var(--bo);display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0}
.tb-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;background:var(--sur2);border:1px solid var(--bo);font-size:11.5px;color:var(--mu2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:24px}
.hero{background:linear-gradient(135deg,#1A1008,#0F0F18,#0A0A0F);border:1px solid var(--bo);border-radius:20px;padding:32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,77,0,.18),transparent 70%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;background:rgba(255,77,0,.15);border:1px solid rgba(255,77,0,.3);border-radius:20px;padding:3px 11px;font-size:10.5px;color:var(--ac2);margin-bottom:14px}
.hero-h{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.15;margin-bottom:10px}.hero-h span{color:var(--ac)}
.hero-p{font-size:14px;color:var(--mu2);line-height:1.6;max-width:440px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s}
.card:hover{border-color:var(--boh);transform:translateY(-2px)}.card.pri{border-color:rgba(255,77,0,.35);background:rgba(255,77,0,.05)}
.card-ic{font-size:22px;margin-bottom:10px}.card-h{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;margin-bottom:5px}
.card-p{font-size:12px;color:var(--mu2);line-height:1.5}.card-cta{margin-top:12px;font-size:11.5px;font-weight:500;color:var(--ac2)}
.fwrap{max-width:680px}.fhead{margin-bottom:24px}.fhead h2{font-family:'Syne',sans-serif;font-weight:700;font-size:20px;margin-bottom:5px}.fhead p{color:var(--mu2);font-size:13.5px}
.sec{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:20px;margin-bottom:14px}
.sec-t{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--ac2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--bo)}
.fi{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fi label{font-size:12px;font-weight:500;color:var(--mu2)}
.fi input,.fi textarea{background:var(--sur2);border:1px solid var(--bo);border-radius:8px;color:var(--tx);font-size:13.5px;padding:9px 12px;outline:none;width:100%;resize:none;font-family:'DM Sans',sans-serif;transition:border-color .2s}
.fi input:focus,.fi textarea:focus{border-color:rgba(255,77,0,.5)}.fi textarea{min-height:72px}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.itabs{display:flex;gap:6px;margin-bottom:14px}
.itab{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bo);background:var(--sur2);color:var(--mu2);font-size:12.5px;cursor:pointer;transition:all .15s;text-align:center;font-family:'DM Sans',sans-serif}
.itab:hover{border-color:var(--boh)}.itab.on{border-color:var(--ac);background:rgba(255,77,0,.08);color:var(--ac2)}
.iup{border:2px dashed var(--bo);border-radius:8px;padding:24px;text-align:center;cursor:pointer;background:var(--sur2);transition:all .2s}
.iup:hover,.iup.drag{border-color:var(--ac);background:rgba(255,77,0,.05)}
.iup-icon{font-size:28px;margin-bottom:8px}.iup-txt{font-size:13px;color:var(--mu2)}.iup-txt span{color:var(--ac2);font-weight:500}
.iprevs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ithumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--bo)}
.ithumb img{width:100%;height:100%;object-fit:cover}
.ithumb-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;font-size:10px;cursor:pointer}
.obj-q{font-size:13px;color:var(--mu2);margin-bottom:12px}
.obj-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.obj-o{padding:16px 10px;border-radius:8px;border:1px solid var(--bo);background:var(--sur2);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
.obj-o:hover{border-color:var(--boh)}.obj-o.on{border-color:var(--ac);background:rgba(255,77,0,.08)}
.obj-ic{font-size:24px}.obj-lbl{font-size:12.5px;font-weight:600;line-height:1.3}.obj-ds{font-size:11px;color:var(--mu);line-height:1.4}
.ton-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ton-o{padding:12px 10px;border-radius:8px;border:1px solid var(--bo);background:var(--sur2);cursor:pointer;transition:all .15s;text-align:center}
.ton-o:hover{border-color:var(--boh)}.ton-o.on{border-color:var(--ac);background:rgba(255,77,0,.08)}
.ton-lbl{font-size:12.5px;font-weight:600;margin-bottom:3px}.ton-ds{font-size:10.5px;color:var(--mu);line-height:1.3}
.gbtn{width:100%;padding:15px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;transition:all .2s;margin-top:8px}
.gbtn:hover{background:#FF6520;transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,77,0,.3)}.gbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(10,10,15,.93);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);padding:20px}
.ov-card{background:var(--sur);border:1px solid var(--bo);border-radius:20px;padding:40px 48px;text-align:center;max-width:400px;width:100%}
.spin{width:56px;height:56px;margin:0 auto 20px;border:3px solid var(--bo);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov-h{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;margin-bottom:6px}.ov-p{color:var(--mu2);font-size:13px;line-height:1.6}
.ov-steps{margin-top:20px;display:flex;flex-direction:column;gap:6px;text-align:left}
.ov-s{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mu);padding:7px 10px;border-radius:8px;transition:all .3s}
.ov-s.ac{background:rgba(255,77,0,.08);color:var(--tx)}.ov-s.dn{color:var(--ok)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--mu);flex-shrink:0}
.ov-s.ac .sdot{background:var(--ac);animation:pu 1s infinite}.ov-s.dn .sdot{background:var(--ok)}
.rh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:14px;flex-wrap:wrap}
.rh-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}.rh-meta{font-size:12.5px;color:var(--mu2);margin-top:3px}
.rh-acts{display:flex;gap:7px;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--bo);background:var(--sur2);color:var(--tx);font-size:12.5px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.abtn:hover{border-color:var(--boh)}.abtn.pr{background:var(--ac);border-color:var(--ac);color:#fff}.abtn.pr:hover{background:#FF6520}
.tabs{display:flex;gap:3px;margin-bottom:18px;border-bottom:1px solid var(--bo);overflow-x:auto}
.tab{padding:7px 14px 11px;border:none;background:transparent;color:var(--mu2);font-size:12.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:'DM Sans',sans-serif}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ac2);border-bottom-color:var(--ac)}
.scripts{display:flex;flex-direction:column;gap:14px}
.sc{background:var(--sur);border:1px solid var(--bo);border-radius:14px;overflow:hidden;transition:border-color .2s}.sc:hover{border-color:var(--boh)}
.sc-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer}
.sc-n{width:26px;height:26px;border-radius:6px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:#fff;flex-shrink:0}
.sc-inf{flex:1;min-width:0}.sc-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc-pilar{font-size:11px;color:var(--mu2);margin-top:1px}
.sc-tags{display:flex;gap:5px;flex-shrink:0}
.tag{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;background:var(--sur2);border:1px solid var(--bo);color:var(--mu2)}
.tag.topo{background:rgba(45,222,152,.1);border-color:rgba(45,222,152,.2);color:var(--ok)}.tag.meio{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.2);color:var(--gold)}.tag.fundo{background:rgba(255,77,0,.1);border-color:rgba(255,77,0,.2);color:var(--ac2)}.tag.ugc{background:rgba(155,142,255,.1);border-color:rgba(155,142,255,.2);color:var(--pu)}
.sc-body{padding:18px;display:none;border-top:1px solid var(--bo)}.sc-body.op{display:block}
.sc-bl{margin-bottom:14px}
.sc-bl-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.sc-bl-lbl::before{content:'';display:inline-block;width:3px;height:11px;background:var(--ac);border-radius:2px}
.sc-bl-lbl.b::before{background:var(--gold)}.sc-bl-lbl.c::before{background:var(--ok)}
.sc-bl-txt{font-size:13.5px;line-height:1.75;color:var(--tx);background:var(--sur2);border-radius:8px;padding:12px 14px;white-space:pre-wrap}
.sc-ft{display:flex;justify-content:flex-end;margin-top:14px}
.var-sec{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:18px;margin-bottom:18px}
.var-t{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.var-t::after{content:'';flex:1;height:1px;background:var(--bo)}
.var-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.var-btn{padding:11px;border-radius:8px;border:1px solid var(--bo);background:var(--sur2);color:var(--tx);font-size:12.5px;cursor:pointer;transition:all .15s;text-align:center;font-family:'DM Sans',sans-serif}
.var-btn:hover{border-color:var(--boh)}.var-btn .vi{display:block;font-size:18px;margin-bottom:4px}.var-btn.ld{opacity:.6;cursor:not-allowed}
.cbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1px solid var(--bo);background:transparent;color:var(--mu2);font-size:11.5px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.cbtn:hover{border-color:var(--boh);color:var(--tx)}.cbtn.cp{border-color:rgba(45,222,152,.3);color:var(--ok)}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:16px}.pcard:hover{border-color:var(--boh)}
.pcard-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.pname{font-family:'Syne',sans-serif;font-weight:700;font-size:13px}.ptype{font-size:11px;color:var(--mu);margin-top:1px}
.prow{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.prow-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);min-width:60px;margin-top:1px}.prow-v{font-size:12px;color:var(--mu2);line-height:1.4}
.ins-box{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:18px;margin-bottom:20px}
.ins-g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ins-i{padding:13px;background:var(--sur2);border-radius:8px}
.ins-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:5px}.ins-v{font-size:13px;line-height:1.5}
.mx-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mx-c{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:16px}
.mx-t{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:var(--ac2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.mx-i{padding:5px 0;border-bottom:1px solid var(--bo);font-size:12.5px;color:var(--mu2)}.mx-i:last-child{border-bottom:none}
.hl{display:flex;flex-direction:column;gap:10px}
.hi{background:var(--sur);border:1px solid var(--bo);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}.hi:hover{border-color:var(--boh)}
.hi-inf{flex:1}.hi-n{font-weight:500;font-size:13.5px;margin-bottom:2px}.hi-m{font-size:11.5px;color:var(--mu)}
.hi-b{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(255,77,0,.1);border:1px solid rgba(255,77,0,.2);color:var(--ac2)}
.emp{text-align:center;padding:56px 20px}.emp-ic{font-size:44px;margin-bottom:14px;opacity:.45}
.emp-h{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;margin-bottom:7px}.emp-p{color:var(--mu2);font-size:13.5px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--sur);border:1px solid var(--bo);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:200;animation:tsl .3s ease}
@keyframes tsl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mob-bar{display:none;height:54px;border-bottom:1px solid var(--bo);align-items:center;padding:0 16px;gap:12px;flex-shrink:0;background:var(--sur)}
.mob-btn{background:transparent;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:4px}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:49}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:16px}
.loading-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:24px}
.loading-logo span{color:var(--ac)}
.loading-spin{width:36px;height:36px;border:3px solid var(--bo);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}

rdade e que, vamos combinar. Cada frase tem que soar dita por uma pessoa, nao escrita por um robo."+" NESTA RODADA "+rod+": gere 2 personas e EXATAMENTE 5 roteiros, 1 para cada pilar na ordem acima. Numere os roteiros com id sequencial de "+idIni+" a "+idFim+". Nas proximas rodadas, gere roteiros TOTALMENTE DIFERENTES dos anteriores."+" RESPONDA APENAS COM JSON VALIDO SEM MARKDOWN, exatamente neste formato: {\"personas\":[{\"nome\":\"...\",\"tipo\":\"...\",\"emoji\":\"1 emoji\",\"motivacao\":\"...\",\"dor\":\"...\",\"objecao\":\"...\",\"comunicacao\":\"...\"}],\"inteligencia\":{\"insight\":\"...\",\"bigIdea\":\"...\",\"mecanismo\":\"...\",\"diferencial\":\"...\",\"dores\":[\"...\"],\"desejos\":[\"...\"],\"objecoes\":[\"...\"],\"gatilhos\":[\"...\"]},\"roteiros\":[{\"id\":"+idIni+",\"titulo\":\"titulo curto\",\"pilar\":\"nome do pilar\",\"funil\":\"topo\",\"gancho\":\"...\",\"corpo\":\"...\",\"cta\":\"...\"}]}"+" O campo funil DEVE ser exatamente um destes valores em minusculo: topo, meio ou fundo (Conceito Criativo e Consciencia=topo; Angulo-Diferencial e DSB=meio; Decisao e Prova=fundo). NUNCA use aspas duplas dentro dos valores de texto, use aspas simples.";

async function lerConteudoUrl(url){
  var prompt="Acesse e leia o conteudo real desta URL e extraia as informacoes do negocio para criar anuncios. URL: "+url+". "
    +"Se for um link do Instagram, extraia o que conseguir da legenda, bio e descricao visivel. "
    +"Responda APENAS com JSON valido sem markdown neste formato: {\"produto\":\"o que e vendido\",\"publico\":\"para quem\",\"diferenciais\":\"detalhes concretos do produto: material, modelagem, funcionalidade, etc\",\"preco\":\"se houver\",\"tom\":\"tom de voz percebido\",\"argumentos\":\"argumentos de venda usados\"}. "
    +"Se nao conseguir acessar o conteudo, responda exatamente {\"erro\":\"sem acesso\"}.";
  try{
    var res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(window.__authToken||"")},body:JSON.stringify({
      messages:[{role:"user",content:prompt}],
      max_tokens:1500,
      model:"claude-sonnet-4-6",
      tools:[{type:"web_fetch_20260209",name:"web_fetch"}]
    })});
    if(!res.ok)return null;
    var data=await res.json();
    if(data.error)return null;
    var raw=(data.content||[]).map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
    var s=raw.indexOf("{"),e=raw.lastIndexOf("}");
    if(s<0||e<0)return null;
    var o=JSON.parse(raw.substring(s,e+1));
    if(o.erro||(!o.produto&&!o.diferenciais))return null;
    return o;
  }catch(err){return null;}
}

async function revisarRoteiros(roteiros){

    if(!Array.isArray(roteiros)||!roteiros.length)return roteiros;
    var prompt="Voce e um diretor de criacao revisando roteiros de Meta Ads feitos por um redator junior. Para CADA roteiro avalie com rigor: o gancho prende nos 3 primeiros segundos e cita algo ESPECIFICO do negocio? Soa como uma pessoa real falando, sem cara de IA (sem cliches como eleve, descomplique, transforme sua vida, imagine so, a verdade e que, e sem o traco longo entre frases)? O corpo tem 1 argumento ou prova concreta? O CTA conecta com a dor do gancho e e especifico? Reescreva os roteiros fracos para ficarem mais especificos, naturais e persuasivos; mantenha os que ja estao bons. Responda APENAS com JSON valido sem markdown, um objeto {\"roteiros\":[...]} com a MESMA quantidade de roteiros e os mesmos campos id, titulo, pilar, funil, gancho, corpo, cta. NUNCA use aspas duplas dentro dos textos, use aspas simples. ROTEIROS PARA REVISAR: "+JSON.stringify({roteiros:roteiros});
    var res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(window.__authToken||"")},body:JSON.stringify({messages:[{role:"user",content:prompt}],max_tokens:5000,model:"claude-sonnet-4-6"})});
    if(!res.ok)return roteiros;
    var data=await res.json();
    if(data.error)return roteiros;
    var raw=(data.content||[]).map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
    var p;
    try{p=JSON.parse(raw);}
    catch(e1){var s=raw.indexOf("{"),en=raw.lastIndexOf("}");if(s>-1&&en>-1){try{p=JSON.parse(raw.substring(s,en+1));}catch(e2){return roteiros;}}else return roteiros;}

  }catch(e){return roteiros;}
}
